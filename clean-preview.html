<script>
const robot=document.querySelector('.robot');
const motion=matchMedia('(prefers-reduced-motion: reduce)');
function positionRobot(){
 const progress=motion.matches?0:Math.min(1,scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight));
 robot.style.setProperty('--gap',progress*9+'px');
 robot.style.transform='rotateX(-13deg) rotateY('+(-21-progress*30)+'deg)';
}
addEventListener('scroll',positionRobot,{passive:true});
motion.addEventListener('change',positionRobot);
positionRobot();
</script></html>
